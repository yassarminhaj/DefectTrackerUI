<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Defect Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <h1 class="login-title">Defect Tracker</h1>
      <p class="login-subtitle">QA defect lifecycle tracking prototype</p>
      <form data-demo-form>
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="qa.user">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Password">
        <a class="button button-primary u-full-width" href="dashboard.html">Login</a>
        <p class="muted" data-form-message></p>
      </form>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
